name: Build and Push Docker Image

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # Exposed on localhost:5432 automatically - this job doesn't run inside
      # its own container, so GitHub Actions maps every published service
      # port straight onto the runner host.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: realestateapp
          POSTGRES_PASSWORD: realestateapp
          POSTGRES_DB: realestateapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      # The pytest suite's own db_engine fixture creates and migrates a
      # separate <db>_test database for tests that need transaction-per-test
      # isolation (see tests/conftest.py) - it never touches this plain
      # POSTGRES_DSN database. Some tests (worker/Celery tests that exercise
      # a real embedded worker on its own thread) can't safely share that
      # fixture's single rebound connection, so they write to this database
      # directly instead - which on a fresh CI Postgres service has no
      # tables at all until migrated here, once, up front.
      - name: Run database migrations
        run: uv run python -m alembic upgrade head
        env:
          PYTHONPATH: .
          POSTGRES_DSN: postgresql+asyncpg://realestateapp:realestateapp@localhost:5432/realestateapp

      - name: Run tests
        run: uv run pytest
        env:
          PYTHONPATH: .
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          POSTGRES_DSN: postgresql+asyncpg://realestateapp:realestateapp@localhost:5432/realestateapp
          DB_PERSISTENCE_ENABLED: "true"
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/1

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Critical permission allowing the workflow to push images to GHCR

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 1: Safely lowercase the repository name for Docker registry compatibility
      - name: Downcase Repo Name
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      # Step 2: Log into the GitHub Container Registry securely using short-lived tokens
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Step 3: Automatically manage tags (assigns :latest on main branch, :pr-<num> on PRs)
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=pr

      # Step 4: Run the Docker build engine and push the processed tags up to your profile
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}