# NGINX in front of the application (the `web_app` compose service).
#
# NGINX terminates the client's connection and opens its own, separate
# connection to the upstream - a reverse proxy, working at layer 7: it
# parses HTTP, so it can route by path and apply different buffering and
# timeout rules per location. That per-path control is the reason it exists
# here; the only route needing special treatment is the SSE progress stream.

# Chainlit's UI talks to its server over a WebSocket (socket.io). A
# WebSocket starts as a normal HTTP request carrying `Upgrade: websocket`,
# and NGINX does not forward that hop-by-hop header pair on its own. Send
# `Connection: upgrade` when the client asked for an upgrade, and an empty
# Connection header otherwise (NGINX would otherwise send `Connection:
# close` to the upstream on every request).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
}

server {
    listen 80;
    server_name _;

    # The upstream is addressed by Compose service name and re-resolved at
    # request time through Docker's embedded DNS (127.0.0.11), not once at
    # startup. A plain `proxy_pass http://web_app:8080` (or an `upstream`
    # block naming it) resolves the name a single time when NGINX loads its
    # config and pins that IP for the life of the process. Recreating the
    # web_app container hands it a new IP, and the pinned one then refuses
    # connections: every request is a 502 until NGINX itself is restarted,
    # even though web_app is healthy. Putting the name in a variable is what
    # makes NGINX consult `resolver` per request (cached for `valid`).
    # Cost: a variable proxy_pass can't use an `upstream` block, so there is
    # no keepalive pool to the app - one new connection per request, which
    # is negligible on the same Docker network.
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $app_upstream web_app:8080;

    # Request bodies here are small JSON documents (a report request).
    client_max_body_size 1m;

    # Defaults for every proxied location; specific locations override.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    # Upstream timeouts. Connecting to a healthy container on the same
    # network is near-instant, so a slow connect means it is down - fail
    # in seconds rather than hold the client. The read timeout is the
    # longest NGINX waits between two *reads* from the upstream (not the
    # whole response), sized above the slowest ordinary API call.
    proxy_connect_timeout 5s;
    proxy_send_timeout    30s;
    proxy_read_timeout    60s;

    # NGINX's own liveness check: answered by NGINX itself, never proxied,
    # so it says "the proxy is up", independent of the application behind it
    # (which /health and /health/ready below still report on).
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Server-Sent Events: GET /api/v1/reports/{id}/stream.
    #
    # By default NGINX buffers an upstream response - it reads as much as it
    # can into memory and only flushes to the client when a buffer fills or
    # the upstream finishes. That is right for a normal response (it frees
    # the app to move on from a slow client) and silently wrong for a
    # stream: a progress event is a few dozen bytes, nowhere near a buffer,
    # so every event sits in NGINX until the job is over and the client
    # sees the whole run arrive in one burst at the end. Nothing errors and
    # every status code is 200.
    location ~ ^/api/v1/reports/[^/]+/stream$ {
        proxy_pass http://$app_upstream;

        proxy_buffering off;
        # Don't let a response cache ever hold a live stream.
        proxy_cache off;
        # Keep the upstream connection HTTP/1.1 with no `Connection: close`
        # so the chunked stream isn't torn down after the first write.
        proxy_set_header Connection "";
        # A stream is only ever a GET; make a retry to another upstream
        # impossible, since replaying half a stream would duplicate events.
        proxy_next_upstream off;

        # The app sends a `: heartbeat` comment every
        # SSE_HEARTBEAT_INTERVAL_SECONDS (15s by default) when idle, and
        # every heartbeat resets this timer. It only has to outlast a gap
        # of several missed heartbeats; sized to the app's own overall
        # report deadline (REPORT_POLL_TIMEOUT_SECONDS, 300s) plus headroom.
        proxy_read_timeout 330s;
    }

    # Chainlit's WebSocket. Idle sessions legitimately sit silent for a
    # long time, and NGINX's default 60s read timeout would drop them.
    location /ws/ {
        proxy_pass http://$app_upstream;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Everything else: the JSON API, the Chainlit UI's HTTP assets, the
    # health endpoints. Ordinary buffered proxying.
    location / {
        proxy_pass http://$app_upstream;
    }
}
