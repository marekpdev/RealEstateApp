<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 770" width="1200" height="770" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="System architecture: clients reach FastAPI through NGINX; FastAPI records jobs in PostgreSQL and enqueues work in Redis; a Celery worker running the LangGraph agents consumes tasks, writes audit rows and publishes progress events that stream back to the client over Server-Sent Events.">
