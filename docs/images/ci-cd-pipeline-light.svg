<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 400" width="1120" height="400" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="CI/CD: a push or pull request to main runs the test job against real PostgreSQL 16 and Redis 7 service containers; only if it passes, the build job pushes a multi-stage image to GHCR. Deploying to Azure AKS, provisioned by Terraform, is a deliberate manual kubectl apply.">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker></defs>
<rect x="30" y="50" width="180" height="110" rx="14" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>
<text x="120.0" y="89.0" font-size="17" font-weight="700" fill="#111827" text-anchor="middle" >Trigger</text>
<text x="120.0" y="111.0" font-size="14" font-weight="400" fill="#4b5563" text-anchor="middle" >push or pull request</text>
<text x="120.0" y="130.0" font-size="14" font-weight="400" fill="#4b5563" text-anchor="middle" >to main</text>
<path d="M210 105 L256 105" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="260" y="50" width="230" height="110" rx="14" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
<text x="375.0" y="80.0" font-size="17" font-weight="700" fill="#111827" text-anchor="middle" >Test job</text>
<text x="375.0" y="102.0" font-size="14" font-weight="400" fill="#4b5563" text-anchor="middle" >real Postgres 16 + Redis 7</text>
<text x="375.0" y="121.0" font-size="14" font-weight="400" fill="#4b5563" text-anchor="middle" >alembic upgrade head</text>
<text x="375.0" y="140.0" font-size="14" font-weight="400" fill="#4b5563" text-anchor="middle" >pytest</text>
<path d="M490 105 L596 105" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="493.0" y="80" width="100" height="22" rx="6" fill="#ffffff" opacity="0.92"/>
<text x="543" y="95" font-size="13.5" font-weight="600" fill="#4b5563" text-anchor="middle" >needs: test</text>
<rect x="600" y="50" width="220" height="110" rx="14" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
<text x="710.0" y="89.0" font-size="17" font-weight="700" fill="#111827" text-anchor="middle" >Build and push</text>
<text x="710.0" y="111.0" font-size="14" font-weight="400" fill="#4b5563" text-anchor="middle" >multi-stage Docker image</text>
<text x="710.0" y="130.0" font-size="14" font-weight="400" fill="#4b5563" text-anchor="middle" >non-root runtime</text>
<path d="M820 105 L886 105" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="824.0" y="80" width="58" height="22" rx="6" fill="#ffffff" opacity="0.92"/>
<text x="853" y="95" font-size="13.5" font-weight="600" fill="#4b5563" text-anchor="middle" >pushes</text>
<rect x="890" y="50" width="200" height="110" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="990.0" y="89.0" font-size="17" font-weight="700" fill="#111827" text-anchor="middle" >GHCR</text>
<text x="990.0" y="111.0" font-size="14" font-weight="400" fill="#4b5563" text-anchor="middle" >container registry</text>
<text x="990.0" y="130.0" font-size="14" font-weight="400" fill="#4b5563" text-anchor="middle" >latest · pr-N tags</text>
<path d="M990 160 L990 256" fill="none" stroke="#475569" stroke-width="2.2" stroke-dasharray="7 6" marker-end="url(#a)"/>
<rect x="897.0" y="197" width="186" height="22" rx="6" fill="#ffffff" opacity="0.92"/>
<text x="990" y="212" font-size="13.5" font-weight="600" fill="#4b5563" text-anchor="middle" >manual: kubectl apply</text>
<rect x="890" y="260" width="200" height="90" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="990.0" y="289.0" font-size="17" font-weight="700" fill="#111827" text-anchor="middle" >Azure AKS</text>
<text x="990.0" y="311.0" font-size="14" font-weight="400" fill="#4b5563" text-anchor="middle" >Kubernetes cluster</text>
<text x="990.0" y="330.0" font-size="14" font-weight="400" fill="#4b5563" text-anchor="middle" >web tier deployed</text>
<rect x="580" y="260" width="210" height="90" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="685.0" y="289.0" font-size="17" font-weight="700" fill="#111827" text-anchor="middle" >Terraform</text>
<text x="685.0" y="311.0" font-size="14" font-weight="400" fill="#4b5563" text-anchor="middle" >infrastructure as code</text>
<text x="685.0" y="330.0" font-size="14" font-weight="400" fill="#4b5563" text-anchor="middle" >azurerm provider</text>
<path d="M790 305 L886 305" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="806.0" y="278" width="64" height="22" rx="6" fill="#ffffff" opacity="0.92"/>
<text x="838" y="293" font-size="13.5" font-weight="600" fill="#4b5563" text-anchor="middle" >creates</text>
<text x="30" y="282" font-size="13" font-weight="700" fill="#64748b" text-anchor="start" letter-spacing="2">NOTHING DEPLOYS ITSELF</text>
<text x="30" y="308" font-size="14" font-weight="400" fill="#4b5563" text-anchor="start" >CI ends at the registry. Rolling out is a</text>
<text x="30" y="328" font-size="14" font-weight="400" fill="#4b5563" text-anchor="start" >deliberate manual step (kubectl apply),</text>
<text x="30" y="348" font-size="14" font-weight="400" fill="#4b5563" text-anchor="start" >documented in DEPLOYMENT.md.</text>
</svg>