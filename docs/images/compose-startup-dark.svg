<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1170 470" width="1170" height="470" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Docker Compose startup order in four waves: PostgreSQL and Redis become healthy; a one-shot migration job brings the schema up to date and exits; the web app, worker and Celery Beat start; NGINX starts last, once the web app is healthy, and is the only way in.">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker></defs>
<text x="30" y="44" font-size="13" font-weight="700" fill="#8b949e" text-anchor="start" letter-spacing="2">1 · INFRASTRUCTURE</text>
<text x="300" y="44" font-size="13" font-weight="700" fill="#8b949e" text-anchor="start" letter-spacing="2">2 · SCHEMA</text>
<text x="640" y="44" font-size="13" font-weight="700" fill="#8b949e" text-anchor="start" letter-spacing="2">3 · APPLICATION</text>
<text x="990" y="44" font-size="13" font-weight="700" fill="#8b949e" text-anchor="start" letter-spacing="2">4 · EDGE</text>
<rect x="30" y="64" width="180" height="96" rx="14" fill="#3a2b0b" stroke="#d29922" stroke-width="2"/>
<text x="120.0" y="96.0" font-size="17" font-weight="700" fill="#e6edf3" text-anchor="middle" >postgres</text>
<text x="120.0" y="118.0" font-size="14" font-weight="400" fill="#9aa7b5" text-anchor="middle" >PostgreSQL 16</text>
<text x="120.0" y="137.0" font-size="14" font-weight="400" fill="#9aa7b5" text-anchor="middle" >pg_isready check</text>
<rect x="30" y="196" width="180" height="96" rx="14" fill="#3a2b0b" stroke="#d29922" stroke-width="2"/>
<text x="120.0" y="228.0" font-size="17" font-weight="700" fill="#e6edf3" text-anchor="middle" >redis</text>
<text x="120.0" y="250.0" font-size="14" font-weight="400" fill="#9aa7b5" text-anchor="middle" >Redis 7</text>
<text x="120.0" y="269.0" font-size="14" font-weight="400" fill="#9aa7b5" text-anchor="middle" >PING check</text>
<rect x="300" y="64" width="230" height="96" rx="14" fill="#2a2050" stroke="#a371f7" stroke-width="2"/>
<text x="415.0" y="96.0" font-size="17" font-weight="700" fill="#e6edf3" text-anchor="middle" >migrate</text>
<text x="415.0" y="118.0" font-size="14" font-weight="400" fill="#9aa7b5" text-anchor="middle" >alembic upgrade head</text>
<text x="415.0" y="137.0" font-size="14" font-weight="400" fill="#9aa7b5" text-anchor="middle" >one-shot: exits when done</text>
<rect x="640" y="64" width="260" height="96" rx="14" fill="#12361f" stroke="#3fb950" stroke-width="2"/>
<text x="770.0" y="96.0" font-size="17" font-weight="700" fill="#e6edf3" text-anchor="middle" >web_app</text>
<text x="770.0" y="118.0" font-size="14" font-weight="400" fill="#9aa7b5" text-anchor="middle" >FastAPI + Chainlit UI</text>
<text x="770.0" y="137.0" font-size="14" font-weight="400" fill="#9aa7b5" text-anchor="middle" >needs: DB · Redis · migration</text>
<rect x="640" y="196" width="260" height="96" rx="14" fill="#2a2050" stroke="#a371f7" stroke-width="2"/>
<text x="770.0" y="228.0" font-size="17" font-weight="700" fill="#e6edf3" text-anchor="middle" >worker</text>
<text x="770.0" y="250.0" font-size="14" font-weight="400" fill="#9aa7b5" text-anchor="middle" >Celery + the agent graph</text>
<text x="770.0" y="269.0" font-size="14" font-weight="400" fill="#9aa7b5" text-anchor="middle" >needs: DB · Redis · migration</text>
<rect x="640" y="328" width="260" height="96" rx="14" fill="#2a2050" stroke="#a371f7" stroke-width="2"/>
<text x="770.0" y="360.0" font-size="17" font-weight="700" fill="#e6edf3" text-anchor="middle" >beat</text>
<text x="770.0" y="382.0" font-size="14" font-weight="400" fill="#9aa7b5" text-anchor="middle" >Celery Beat, exactly one replica</text>
<text x="770.0" y="401.0" font-size="14" font-weight="400" fill="#9aa7b5" text-anchor="middle" >needs: Redis only</text>
<rect x="990" y="64" width="150" height="96" rx="14" fill="#21262d" stroke="#8b949e" stroke-width="2"/>
<text x="1065.0" y="96.0" font-size="17" font-weight="700" fill="#e6edf3" text-anchor="middle" >nginx</text>
<text x="1065.0" y="118.0" font-size="14" font-weight="400" fill="#9aa7b5" text-anchor="middle" >the only way in</text>
<text x="1065.0" y="137.0" font-size="14" font-weight="400" fill="#9aa7b5" text-anchor="middle" >host port 8080</text>
<path d="M210 112 L296 112" fill="none" stroke="#8b949e" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="222.0" y="88" width="62" height="22" rx="6" fill="#0d1117" opacity="0.92"/>
<text x="253" y="103" font-size="13.5" font-weight="600" fill="#9aa7b5" text-anchor="middle" >healthy</text>
<path d="M530 112 L636 112" fill="none" stroke="#8b949e" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="547.0" y="88" width="72" height="22" rx="6" fill="#0d1117" opacity="0.92"/>
<text x="583" y="103" font-size="13.5" font-weight="600" fill="#9aa7b5" text-anchor="middle" >migrated</text>
<path d="M530 140 C583.0 140 583.0 236 636 236" fill="none" stroke="#8b949e" stroke-width="2.2" marker-end="url(#a)"/>
<path d="M900 112 L986 112" fill="none" stroke="#8b949e" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="912.0" y="88" width="62" height="22" rx="6" fill="#0d1117" opacity="0.92"/>
<text x="943" y="103" font-size="13.5" font-weight="600" fill="#9aa7b5" text-anchor="middle" >healthy</text>
<text x="1065" y="190" font-size="14" font-weight="400" fill="#9aa7b5" text-anchor="middle" >nginx starts once</text>
<text x="1065" y="211" font-size="14" font-weight="400" fill="#9aa7b5" text-anchor="middle" >web_app is healthy</text>
<text x="30" y="340" font-size="14" font-weight="400" fill="#9aa7b5" text-anchor="start" >Compose enforces this order with</text>
<text x="30" y="360" font-size="14" font-weight="400" fill="#9aa7b5" text-anchor="start" >depends_on conditions:</text>
<text x="30" y="380" font-size="14" font-weight="400" fill="#9aa7b5" text-anchor="start" >service_healthy and</text>
<text x="30" y="400" font-size="14" font-weight="400" fill="#9aa7b5" text-anchor="start" >service_completed_successfully.</text>
</svg>