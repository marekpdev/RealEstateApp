<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 800" width="1100" height="800" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="The agent graph: an Ingest step turns free text into a typed city and budget; a supervisor with no LLM call fans out to three researchers that run in parallel (Market Data, Neighborhood Vibe, Zoning Law); a Financial Modeler joins their results and writes the investor report.">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker></defs>
<rect x="375" y="24" width="350" height="52" rx="26" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>
<text x="550.0" y="56.0" font-size="15" font-weight="700" fill="#111827" text-anchor="middle" >“Multi-family in Austin, max $900k”</text>
<path d="M550 76 L550 108" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="375" y="110" width="350" height="80" rx="14" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
<text x="550.0" y="134.0" font-size="17" font-weight="700" fill="#111827" text-anchor="middle" >1 · Ingest</text>
<text x="550.0" y="156.0" font-size="14" font-weight="400" fill="#4b5563" text-anchor="middle" >LLM → typed Pydantic output</text>
<text x="550.0" y="175.0" font-size="14" font-weight="400" fill="#4b5563" text-anchor="middle" >city · budget</text>
<path d="M550 190 L550 222" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="375" y="224" width="350" height="80" rx="14" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>
<text x="550.0" y="248.0" font-size="17" font-weight="700" fill="#111827" text-anchor="middle" >2 · Supervisor</text>
<text x="550.0" y="270.0" font-size="14" font-weight="400" fill="#4b5563" text-anchor="middle" >static fan-out, no LLM call</text>
<text x="550.0" y="289.0" font-size="14" font-weight="400" fill="#4b5563" text-anchor="middle" >a graph edge already knows the route</text>
<text x="30" y="130" font-size="13" font-weight="700" fill="#64748b" text-anchor="start" letter-spacing="2">TYPED STATE</text>
<text x="30" y="154" font-size="14" font-weight="400" fill="#4b5563" text-anchor="start" >All six nodes share one Pydantic state.</text>
<text x="30" y="175" font-size="14" font-weight="400" fill="#4b5563" text-anchor="start" >A malformed model answer fails at the</text>
<text x="30" y="196" font-size="14" font-weight="400" fill="#4b5563" text-anchor="start" >node boundary, not three nodes later.</text>
<text x="770" y="130" font-size="13" font-weight="700" fill="#64748b" text-anchor="start" letter-spacing="2">COLOUR KEY</text>
<rect x="770" y="146" width="18" height="18" rx="5" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>
<text x="800" y="160" font-size="14" font-weight="400" fill="#4b5563" text-anchor="start" >plain code, no LLM call</text>
<rect x="770" y="176" width="18" height="18" rx="5" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
<text x="800" y="190" font-size="14" font-weight="400" fill="#4b5563" text-anchor="start" >one LLM call, structured output</text>
<rect x="770" y="206" width="18" height="18" rx="5" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="800" y="220" font-size="14" font-weight="400" fill="#4b5563" text-anchor="start" >tool-calling agent loop</text>
<rect x="20" y="344" width="1060" height="232" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="1062" y="564" font-size="13" font-weight="700" fill="#64748b" text-anchor="end" letter-spacing="2">RUN IN PARALLEL</text>
<path d="M490 304 C490 346.0 190 346.0 190 388" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/>
<path d="M550 304 C550 346.0 550 346.0 550 388" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/>
<path d="M610 304 C610 346.0 910 346.0 910 388" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="515.4" y="323" width="69.19999999999999" height="22" rx="6" fill="#ffffff" opacity="0.92"/>
<text x="550" y="338" font-size="13.5" font-weight="600" fill="#4b5563" text-anchor="middle" >fan-out</text>
<rect x="30" y="390" width="320" height="150" rx="14" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
<text x="190.0" y="440.0" font-size="17" font-weight="700" fill="#111827" text-anchor="middle" >3a · Market Data</text>
<text x="190.0" y="462.0" font-size="14" font-weight="400" fill="#4b5563" text-anchor="middle" >listings API + one LLM classifier</text>
<text x="190.0" y="481.0" font-size="14" font-weight="400" fill="#4b5563" text-anchor="middle" >statistics computed in Python</text>
<text x="190.0" y="500.0" font-size="14" font-weight="400" fill="#4b5563" text-anchor="middle" >cache · breaker · retries</text>
<rect x="390" y="390" width="320" height="150" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="550.0" y="440.0" font-size="17" font-weight="700" fill="#111827" text-anchor="middle" >3b · Neighborhood Vibe</text>
<text x="550.0" y="462.0" font-size="14" font-weight="400" fill="#4b5563" text-anchor="middle" >tool-calling agent</text>
<text x="550.0" y="481.0" font-size="14" font-weight="400" fill="#4b5563" text-anchor="middle" >Wikipedia + OpenStreetMap</text>
<text x="550.0" y="500.0" font-size="14" font-weight="400" fill="#4b5563" text-anchor="middle" >discovered at runtime over MCP</text>
<rect x="750" y="390" width="320" height="150" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="910.0" y="440.0" font-size="17" font-weight="700" fill="#111827" text-anchor="middle" >3c · Zoning Law</text>
<text x="910.0" y="462.0" font-size="14" font-weight="400" fill="#4b5563" text-anchor="middle" >tool-calling agent</text>
<text x="910.0" y="481.0" font-size="14" font-weight="400" fill="#4b5563" text-anchor="middle" >RAG first: Pinecone + Postgres</text>
<text x="910.0" y="500.0" font-size="14" font-weight="400" fill="#4b5563" text-anchor="middle" >web search only as a fallback</text>
<path d="M190 540 C190 572.0 490 572.0 490 604" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/>
<path d="M550 540 C550 572.0 550 572.0 550 604" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/>
<path d="M910 540 C910 572.0 610 572.0 610 604" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="447.0" y="565" width="206.0" height="22" rx="6" fill="#ffffff" opacity="0.92"/>
<text x="550" y="580" font-size="13.5" font-weight="600" fill="#4b5563" text-anchor="middle" >join: waits for all three</text>
<rect x="375" y="606" width="350" height="80" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="550.0" y="630.0" font-size="17" font-weight="700" fill="#111827" text-anchor="middle" >4 · Financial Modeler</text>
<text x="550.0" y="652.0" font-size="14" font-weight="400" fill="#4b5563" text-anchor="middle" >tool-calling agent + Python REPL</text>
<text x="550.0" y="671.0" font-size="14" font-weight="400" fill="#4b5563" text-anchor="middle" >the model delegates the math to code</text>
<path d="M550 686 L550 718" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="375" y="720" width="350" height="62" rx="24" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>
<text x="550.0" y="744.0" font-size="17" font-weight="700" fill="#111827" text-anchor="middle" >Investor-grade report</text>
<text x="550.0" y="766.0" font-size="14" font-weight="400" fill="#4b5563" text-anchor="middle" >saved in Postgres · streamed live</text>
</svg>