apiVersion: apps/v1
kind: Deployment
metadata:
  name: realestateapp-deployment
  labels:
    app: realestateapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: realestateapp
  template:
    metadata:
      labels:
        app: realestateapp
    spec:
      # Kubernetes sends SIGTERM, then waits this many seconds before
      # SIGKILL-ing anything still running (pod deletion, rolling update,
      # node drain - the same sequence either way). The default (30s)
      # would kill a Chainlit user's in-flight poll_until_terminal() wait
      # (config.REPORT_POLL_TIMEOUT_SECONDS, 300s by default) well before
      # it could finish on its own - uvicorn itself places no ceiling of
      # its own on graceful shutdown (timeout_graceful_shutdown defaults to
      # None, i.e. wait for connections to drain), so this is the only
      # actual limit in play. Sized to REPORT_POLL_TIMEOUT_SECONDS plus
      # headroom for uvicorn/lifespan teardown to run after connections
      # close - see docker-compose.yml's matching stop_grace_period.
      terminationGracePeriodSeconds: 330
      containers:
      - name: realestateapp-container
        image: ghcr.io/marekpdev/realestateapp:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080

        resources:
          limits:
            cpu: "1"
            memory: 1Gi
          requests:
            cpu: "500m"
            memory: 512Mi

        env:
        # ==========================================
        # ⚙️ 1. NON-SENSITIVE CONFIGURATIONS (Plain Text)
        # ==========================================
        - name: DEBUG_MODE
          value: "False"
        - name: PINECONE_INDEX_NAME
          value: "real-estate-app"
        - name: DB_PERSISTENCE_ENABLED
          value: "True"

        # Application testing toggles
        - name: MOCK_FINANCIAL_MODELER_AGENT_OUTPUT
          value: "False"
        - name: MOCK_INGEST_INPUT_AGENT_OUTPUT
          value: "False"
        - name: MOCK_MARKET_DATA_AGENT_OUTPUT
          value: "False"
        - name: MOCK_NEIGHBORHOOD_VIBE_AGENT_OUTPUT
          value: "False"
        - name: MOCK_ZONING_LAW_AGENT_OUTPUT
          value: "False"
        - name: MOCK_MARKET_DATA_API
          value: "False"

        # ==========================================
        # 🔒 2. SENSITIVE APPLICATION SECRETS (Pointers)
        # ==========================================
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: realestateapp-secrets
              key: OPENAI_API_KEY
        - name: GH_TOKEN
          valueFrom:
            secretKeyRef:
              name: realestateapp-secrets
              key: GH_TOKEN
        - name: RAPIDAPI_KEY
          valueFrom:
            secretKeyRef:
              name: realestateapp-secrets
              key: RAPIDAPI_KEY
        - name: BRAVE_API_KEY
          valueFrom:
            secretKeyRef:
              name: realestateapp-secrets
              key: BRAVE_API_KEY
        - name: PINECONE_API_KEY
          valueFrom:
            secretKeyRef:
              name: realestateapp-secrets
              key: PINECONE_API_KEY
        - name: AZURE_STORAGE_CONNECTION_STRING
          valueFrom:
            secretKeyRef:
              name: realestateapp-secrets
              key: AZURE_STORAGE_CONNECTION_STRING
        # Contains a password, so it belongs here with the secrets rather
        # than in the plain-text config block above.
        - name: POSTGRES_DSN
          valueFrom:
            secretKeyRef:
              name: realestateapp-secrets
              key: POSTGRES_DSN