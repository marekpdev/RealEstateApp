services:
  postgres:
    image: postgres:16
    container_name: realestateapp_postgres
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=realestateapp
      - POSTGRES_PASSWORD=realestateapp
      - POSTGRES_DB=realestateapp
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U realestateapp -d realestateapp"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: realestateapp_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  web_app:
    build: .
    image: realestateapp:local
    container_name: realestateapp_container
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - /app/.venv
    env_file:
      - .env
    environment:
      - DEBUG_MODE
      - GH_TOKEN
      - RAPIDAPI_KEY
      - BRAVE_API_KEY
      - MOCK_FINANCIAL_MODELER_AGENT_OUTPUT
      - MOCK_INGEST_INPUT_AGENT_OUTPUT
      - MOCK_MARKET_DATA_AGENT_OUTPUT
      - MOCK_NEIGHBORHOOD_VIBE_AGENT_OUTPUT
      - MOCK_ZONING_LAW_AGENT_OUTPUT
      - MOCK_MARKET_DATA_API
      # Overridden here: the host-shaped default in .env.example points at
      # localhost, which inside this container is itself, not the postgres
      # service. Compose's service-name DNS resolves "postgres" to that container.
      - POSTGRES_DSN=postgresql+asyncpg://realestateapp:realestateapp@postgres:5432/realestateapp
      - DB_POOL_SIZE
      - DB_MAX_OVERFLOW
      - DB_ECHO
      - DB_PERSISTENCE_ENABLED
      # app.py now enqueues generate_report onto the worker (Phase 2.2)
      # instead of running the graph inline, so this container needs to
      # reach Redis as a broker client too, not just the worker service.
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - REPORT_POLL_INTERVAL_SECONDS
      - REPORT_POLL_TIMEOUT_SECONDS
      # generate_report's retry/backoff/DLQ policy - passed here too
      # because this process imports worker.tasks (to call .delay()),
      # which evaluates these as the task's decorator arguments on import,
      # even though only the worker process ever actually executes a retry.
      - TASK_MAX_RETRIES
      - TASK_RETRY_BACKOFF_BASE_SECONDS
      - TASK_RETRY_BACKOFF_MAX_SECONDS
      - DEAD_LETTER_QUEUE_NAME
      - TASK_FAILURE_INJECTION_COUNT

  worker:
    build: .
    image: realestateapp:local
    container_name: realestateapp_worker
    command: ["uv", "run", "celery", "-A", "worker.celery_app", "worker", "--loglevel=info"]
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/.venv
    env_file:
      - .env
    environment:
      - DEBUG_MODE
      - GH_TOKEN
      - RAPIDAPI_KEY
      - BRAVE_API_KEY
      - MOCK_FINANCIAL_MODELER_AGENT_OUTPUT
      - MOCK_INGEST_INPUT_AGENT_OUTPUT
      - MOCK_MARKET_DATA_AGENT_OUTPUT
      - MOCK_NEIGHBORHOOD_VIBE_AGENT_OUTPUT
      - MOCK_ZONING_LAW_AGENT_OUTPUT
      - MOCK_MARKET_DATA_API
      - POSTGRES_DSN=postgresql+asyncpg://realestateapp:realestateapp@postgres:5432/realestateapp
      - DB_POOL_SIZE
      - DB_MAX_OVERFLOW
      - DB_ECHO
      - DB_PERSISTENCE_ENABLED
      # Same reasoning as POSTGRES_DSN above: "redis" is the Compose service
      # name, not a host reachable as "localhost" from inside this container.
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - TASK_MAX_RETRIES
      - TASK_RETRY_BACKOFF_BASE_SECONDS
      - TASK_RETRY_BACKOFF_MAX_SECONDS
      - DEAD_LETTER_QUEUE_NAME
      - TASK_FAILURE_INJECTION_COUNT

volumes:
  postgres_data: