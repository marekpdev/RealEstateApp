services:
  postgres:
    image: postgres:16
    container_name: realestateapp_postgres
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=realestateapp
      - POSTGRES_PASSWORD=realestateapp
      - POSTGRES_DB=realestateapp
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U realestateapp -d realestateapp"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: realestateapp_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  web_app:
    build: .
    image: realestateapp:local
    container_name: realestateapp_container
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    # Compose's own name for what Kubernetes calls terminationGracePeriodSeconds
    # (see k8s/deployment.yaml): how long `docker compose stop`/`down` waits
    # after SIGTERM before SIGKILL-ing the container. Without this, Compose's
    # 10s default would kill a Chainlit session's poll_until_terminal() wait
    # (config.REPORT_POLL_TIMEOUT_SECONDS, 300s by default) long before it
    # could ever finish on its own - uvicorn itself waits indefinitely for
    # in-flight connections to drain (its own timeout_graceful_shutdown
    # defaults to None), so this is the only actual ceiling in play. Sized
    # to REPORT_POLL_TIMEOUT_SECONDS plus headroom for uvicorn/lifespan
    # teardown, not to a task duration - the API process itself never runs
    # the graph (the worker does); it only ever waits on one.
    stop_grace_period: 330s
    volumes:
      - .:/app
      - /app/.venv
    env_file:
      - .env
    environment:
      - DEBUG_MODE
      - GH_TOKEN
      - RAPIDAPI_KEY
      - BRAVE_API_KEY
      - MOCK_FINANCIAL_MODELER_AGENT_OUTPUT
      - MOCK_INGEST_INPUT_AGENT_OUTPUT
      - MOCK_MARKET_DATA_AGENT_OUTPUT
      - MOCK_NEIGHBORHOOD_VIBE_AGENT_OUTPUT
      - MOCK_ZONING_LAW_AGENT_OUTPUT
      - MOCK_MARKET_DATA_API
      # Overridden here: the host-shaped default in .env.example points at
      # localhost, which inside this container is itself, not the postgres
      # service. Compose's service-name DNS resolves "postgres" to that container.
      - POSTGRES_DSN=postgresql+asyncpg://realestateapp:realestateapp@postgres:5432/realestateapp
      - DB_POOL_SIZE
      - DB_MAX_OVERFLOW
      - DB_ECHO
      - DB_PERSISTENCE_ENABLED
      # app.py now enqueues generate_report onto the worker (Phase 2.2)
      # instead of running the graph inline, so this container needs to
      # reach Redis as a broker client too, not just the worker service.
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - REPORT_POLL_INTERVAL_SECONDS
      - REPORT_POLL_TIMEOUT_SECONDS
      # The rate limiter is only enforced in the API process, so only
      # web_app (not worker/beat below) needs these. Same reasoning as
      # REDIS_URL above for overriding the host-shaped default.
      - RATE_LIMIT_REDIS_URL=redis://redis:6379/2
      - RATE_LIMIT_BUCKET_CAPACITY
      - RATE_LIMIT_REFILL_PER_SECOND
      - RATE_LIMIT_KEY_TTL_SECONDS
      # generate_report's retry/backoff/DLQ policy - passed here too
      # because this process imports worker.tasks (to call .delay()),
      # which evaluates these as the task's decorator arguments on import,
      # even though only the worker process ever actually executes a retry.
      - TASK_MAX_RETRIES
      - TASK_RETRY_BACKOFF_BASE_SECONDS
      - TASK_RETRY_BACKOFF_MAX_SECONDS
      - DEAD_LETTER_QUEUE_NAME
      - TASK_FAILURE_INJECTION_COUNT

  worker:
    build: .
    image: realestateapp:local
    container_name: realestateapp_worker
    command: ["uv", "run", "celery", "-A", "worker.celery_app", "worker", "--loglevel=info"]
    # How long `docker compose stop`/`down` waits after SIGTERM before
    # SIGKILL-ing this container - Compose's equivalent of Kubernetes'
    # terminationGracePeriodSeconds. Celery's own warm shutdown (see
    # worker/celery_app.py's worker_soft_shutdown_timeout=0) waits
    # indefinitely for the in-flight generate_report task on a single
    # SIGTERM, so without a grace period long enough to cover that,
    # Compose's 10s default would SIGKILL the worker mid-task - the exact
    # "job stuck in RUNNING forever" failure mode this phase exists to
    # avoid. There's no separate task_time_limit configured for
    # generate_report, so REPORT_POLL_TIMEOUT_SECONDS (the app's own
    # existing definition of "how long a job is allowed to take", used by
    # app.py/cli.py's poll_until_terminal()) is the closest real signal for
    # sizing this, plus headroom for the task's own cleanup.
    stop_grace_period: 330s
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/.venv
    env_file:
      - .env
    environment:
      - DEBUG_MODE
      - GH_TOKEN
      - RAPIDAPI_KEY
      - BRAVE_API_KEY
      - MOCK_FINANCIAL_MODELER_AGENT_OUTPUT
      - MOCK_INGEST_INPUT_AGENT_OUTPUT
      - MOCK_MARKET_DATA_AGENT_OUTPUT
      - MOCK_NEIGHBORHOOD_VIBE_AGENT_OUTPUT
      - MOCK_ZONING_LAW_AGENT_OUTPUT
      - MOCK_MARKET_DATA_API
      - POSTGRES_DSN=postgresql+asyncpg://realestateapp:realestateapp@postgres:5432/realestateapp
      - DB_POOL_SIZE
      - DB_MAX_OVERFLOW
      - DB_ECHO
      - DB_PERSISTENCE_ENABLED
      # Same reasoning as POSTGRES_DSN above: "redis" is the Compose service
      # name, not a host reachable as "localhost" from inside this container.
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - TASK_MAX_RETRIES
      - TASK_RETRY_BACKOFF_BASE_SECONDS
      - TASK_RETRY_BACKOFF_MAX_SECONDS
      - DEAD_LETTER_QUEUE_NAME
      - TASK_FAILURE_INJECTION_COUNT

  beat:
    build: .
    image: realestateapp:local
    container_name: realestateapp_beat
    # A separate process from `worker` on purpose (see the phase's learning
    # document for the full reasoning): Beat only reads worker/celery_app.py's
    # beat_schedule and, on interval, calls apply_async() by task name - it
    # never imports worker.tasks or executes a task body itself, so it needs
    # none of the Postgres/vendor credentials the worker service below does.
    # Exactly one replica, always - two Beat processes would each
    # independently fire the same schedule, duplicating every scheduled task
    # (the overlapping-run lock in worker.sync_knowledge_base guards against
    # concurrent *task* execution, not against a second *scheduler*
    # duplicating deliveries in the first place).
    command: ["uv", "run", "celery", "-A", "worker.celery_app", "beat", "--loglevel=info"]
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/.venv
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - KNOWLEDGE_BASE_SYNC_SCHEDULE_SECONDS

volumes:
  postgres_data: